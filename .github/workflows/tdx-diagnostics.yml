name: PyTDX diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: Expected last completed A-share session (YYYY-MM-DD)
        required: true
  push:
    branches: [main]
    paths:
      - api/tdx-test.py
      - requirements.txt
      - vercel.json
      - .github/workflows/tdx-diagnostics.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_DATE: ${{ inputs.expected_date }}
      VERCEL_URL: https://abc-stock-selection.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed endpoint
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error --max-time 25 \
                --get --data-urlencode "date=$EXPECTED_DATE" \
                "$VERCEL_URL/api/tdx-test" -o vercel-tdx.json &&
                jq -e --arg sha "$GITHUB_SHA" '.vercelRegion == "hkg1" and .commitSha == $sha' vercel-tdx.json >/dev/null; then
              jq 'del(.bars)' vercel-tdx.json
              exit 0
            fi
            sleep 15
          done
          jq 'del(.bars)' vercel-tdx.json || true
          exit 1
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe directly from the runner
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          from datetime import date
          from pathlib import Path

          requested = os.environ["EXPECTED_DATE"]
          expected = date.fromisoformat(requested).isoformat() if requested else None
          diagnose = runpy.run_path("api/tdx-test.py")["diagnose"]
          report = diagnose(expected)
          print(json.dumps({key: value for key, value in report.items() if key != "bars"}))
          Path("runner-tdx.json").write_text(json.dumps(report, allow_nan=False), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdx-diagnostics
          path: |
            vercel-tdx.json
            runner-tdx.json
